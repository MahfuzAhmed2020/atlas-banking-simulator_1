# Optional Docker alternative; Windows native installation remains supported.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: atlas_bank
      MYSQL_USER: atlas
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - atlas-mysql:/var/lib/mysql
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  atlas-mysql:

server:
  port: ${PORT:3000}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: atlas-banking-simulator
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/atlas_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:atlas}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 13MB
springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${DOCS_ENABLED:false}
    path: /swagger-ui.html
    csrf:
      enabled: true
    request-interceptor: >-
      async function(request) { if (!['GET','HEAD','OPTIONS'].includes(request.method.toUpperCase())) { const response = await fetch('/api/auth/csrf', {credentials:'same-origin', cache:'no-store'}); if (!response.ok) throw new Error('Cannot refresh CSRF token'); const csrf = await response.json(); request.headers[csrf.header] = csrf.token; } return request; }
    query-config-enabled: false
    persist-authorization: false
    operations-sorter: method
    tags-sorter: alpha
app:
  totp-key: ${ATLAS_TOTP_KEY:}
  mail-from: ${MAIL_FROM:no-reply@atlas-bank.test}
  uploads: ${UPLOAD_DIR:./private-uploads}
  demo-seed: ${DEMO_SEED:false}
  fema:
    enabled: ${FEMA_ENABLED:false}
  default-admin-password: ${DEMO_ADMIN_PASSWORD:ChangeMe-Admin-123!}
  default-user-password: ${DEMO_USER_PASSWORD:ChangeMe-User-123!}
